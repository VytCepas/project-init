name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded run when a new commit is pushed to the SAME pull request
# (PI-589). Review cycles re-push often; finishing an obsolete run just burns
# runner-minutes. Gated to pull_request events so a `main` push is never
# cancelled. `github.event_name` is in the group key so push and PR runs never
# share a group — same schedule-safe form the template ships.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast static gates across the full support window (#638) — cheap, so all three
  # versions run per PR. Tests are NOT here: they are sharded into parallel jobs
  # below (PI-762), and the full-matrix TEST run is nightly (nightly.yml). A
  # version-specific test break is therefore caught within a day rather than
  # per-PR — the deliberate speed/coverage trade of epic #751.
  checks:
    name: Lint, typecheck, audit
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4

      - name: Sync dev dependencies
        run: uv sync --group dev --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Typecheck (mypy --strict)
        run: just typecheck

      # Dependency vulnerability scan (#637). gitleaks (secret-scan job) catches
      # committed secrets; nothing else here catches a correctly-spelled dep
      # already in uv.lock with a known CVE. pip-audit is pulled in ephemerally
      # via `uv run --with`, the same pattern the scaffolded ci.yml.tmpl uses.
      - name: Dependency vulnerability scan (pip-audit)
        run: just audit

  # Tests, sharded into parallel jobs with pytest-split (PI-762). Each shard is a
  # separate SERIAL process, so the xdist in-process interference that once forced
  # serial CI (#668/PI-759) cannot occur — deterministic AND ~4x faster wall-clock
  # than one serial run. Single Python version per PR (the full matrix runs
  # nightly). The shfmt/bun/just toolchain is installed because several tests
  # DRIVE the scaffolded toolchain rather than asserting text (ts/hook gates,
  # #732/#733/#737) — without it they skip, and a skipped test is not a gate.
  test:
    name: Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.11"

      - name: Install shfmt
        run: |
          mkdir -p "$HOME/.local/bin"
          tmp="$(mktemp -d)"
          curl -sSfL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 -o "$tmp/shfmt_v3.8.0_linux_amd64"
          curl -sSfL https://github.com/mvdan/sh/releases/download/v3.8.0/sha256sums.txt -o "$tmp/sha256sums.txt"
          ( cd "$tmp" && grep 'shfmt_v3.8.0_linux_amd64$' sha256sums.txt | sha256sum -c - )
          chmod +x "$tmp/shfmt_v3.8.0_linux_amd64"
          mv "$tmp/shfmt_v3.8.0_linux_amd64" "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4

      - name: Sync dev dependencies
        run: uv sync --group dev --locked

      - name: Tests (pytest, shard ${{ matrix.shard }})
        # pytest-split partitions the suite deterministically; --splits/--group
        # select this shard. Serial within the shard (no -n) — that is what makes
        # it race-free. Coverage is measured in the nightly full-suite run
        # (nightly.yml), not here, so a shard needs no combine step.
        run: uv run pytest --splits 4 --group ${{ matrix.shard }} --tb=short -q

  wheel-smoke:
    name: Wheel smoke test
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Build wheel
        run: uv build --wheel

      - name: Install wheel into a fresh venv and run scaffolder
        run: |
          set -euo pipefail
          uv venv /tmp/smoke-venv
          # shellcheck disable=SC1091
          source /tmp/smoke-venv/bin/activate
          uv pip install --quiet dist/*.whl
          mkdir -p /tmp/smoke-target
          project-init /tmp/smoke-target \
            --non-interactive \
            --preset obsidian-only \
            --name smoke \
            --description "wheel smoke test" \
            --language python \
            --no-plugin \
            --strict
          # Verify essentials exist
          test -f /tmp/smoke-target/.agents/config.yaml
          test -f /tmp/smoke-target/.agents/project-init.md
          test -f /tmp/smoke-target/CLAUDE.md
          test -f /tmp/smoke-target/AGENTS.md
          # --no-plugin copies the hook payload; exec bits must survive packaging
          test -x /tmp/smoke-target/.agents/hooks/post_edit_lint.sh
          test -x /tmp/smoke-target/.agents/hooks/pre_commit_gate.sh
          # Git-level enforcement hooks (ADR-007) survived packaging
          test -x /tmp/smoke-target/.github/hooks/pre-commit
          test -x /tmp/smoke-target/.github/hooks/pre-push
          # Verify no surviving {{...}} placeholders (--strict already guarantees this)
          ! grep -rn '{{[a-z_]*}}' /tmp/smoke-target || (echo "Unrendered placeholders found"; exit 1)
          echo "OK - wheel smoke test passed"

  # ADR-007 dogfood: the scaffolded projects get this job from ci.yml.tmpl,
  # but this repo itself lacked it — full-history gitleaks scan on every PR.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          # Full history so leaked commits are caught, not just the latest diff
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # PI-363 Layer 2: shellcheck the rendered scaffold output (quoting/SC2086 and
  # general portability the denylist lint can't see). Cheap; runs every PR.
  shellcheck:
    name: ShellCheck (scaffolded scripts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Scaffold a project (templates -> real scripts)
        run: |
          uv run project-init /tmp/sc-target \
            --non-interactive --preset obsidian-only --name sc \
            --description "shellcheck" --language python --no-plugin --strict

      - name: ShellCheck rendered shell scripts
        run: |
          set -euo pipefail
          # Collect every rendered bash script (incl. extensionless git hooks),
          # skipping docs. Read into a quoted array so word-splitting can't bite;
          # scaffold paths never contain spaces/newlines. shellcheck-py is pinned
          # so CI is deterministic and matches local `uvx` runs.
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(
            grep -rIl '^#!/usr/bin/env bash' /tmp/sc-target | grep -v '\.md$'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "error: no scaffolded shell scripts found" >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          uvx --from 'shellcheck-py==0.11.0.1' shellcheck --severity=warning "${files[@]}"

  # PI-363 Layer 3 gate: only spend the 10x-billed macOS minutes when shell or
  # template files actually change. Ordinary PRs skip the macOS job entirely.
  changes:
    name: Detect shell/template changes
    runs-on: ubuntu-24.04
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590  # v3
        id: filter
        with:
          filters: |
            shell:
              - '**/*.sh'
              - '**/*.sh.tmpl'
              - 'templates/**/hooks/**'
              - 'templates/**/scripts/**'
              - 'templates/**/settings.json.tmpl'
              - 'plugins/**/hooks/**'
              - '.github/workflows/ci.yml'

  # PI-363 Layer 3: the real bash-3.2 oracle. macos-latest ships bash 3.2 as
  # /bin/bash and BSD coreutils — the genuine stock-Mac environment — so it
  # catches behavioral breakage (sha256sum/shasum, mapfile, _py.sh resolution)
  # the static denylist can't. Gated to shell/template changes.
  macos-portability:
    name: macOS bash-3.2 portability
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.7"
          python-version: "3.12"

      - name: Confirm the stock-Mac bash is 3.2
        run: /bin/bash --version | head -1

      - name: Scaffold a project
        run: |
          uv run project-init /tmp/macos-target \
            --non-interactive --preset obsidian-only --name mac \
            --description "macos portability" --language python --no-plugin --strict

      - name: SessionStart bootstrap runs under bash 3.2 (sha256sum->shasum)
        run: |
          cd /tmp/macos-target
          # Force the stock bash 3.2; the hook must never exit non-zero.
          /bin/bash .agents/hooks/session_setup.sh
          test -f .agents/.session_setup_stamp

      - name: Commit gate runs under bash 3.2 against a staged file
        run: |
          cd /tmp/macos-target
          git init -q
          git config user.email ci@example.com
          git config user.name ci
          printf 'x = 1\n' > sample.py
          git add sample.py
          # PreToolUse hook: reads tool JSON on stdin, must exit 0 for a clean file.
          printf '%s' '{"tool_input":{"command":"git commit -m test"}}' \
            | /bin/bash .agents/hooks/pre_commit_gate.sh
          echo "pre_commit_gate.sh exit: $?"

      - name: _py.sh resolves an interpreter on macOS
        run: |
          cd /tmp/macos-target
          out=$(/bin/bash .agents/hooks/_py.sh -c "print('resolver-ok')")
          test "$out" = "resolver-ok"

  # PI-463: native Windows (non-WSL) runs hooks through Git Bash when Git for
  # Windows is present (the documented prerequisite). This is the Git Bash
  # oracle — it proves the scaffolded bash hooks fire on Windows, catching
  # CRLF and _py.sh interpreter-resolution breakage the Linux/macOS jobs can't.
  # (Hooks run via `bash <script>`, so exec bits aren't exercised here — that
  # is covered on Linux by test_packaging.) Gated to shell/template changes.
  windows-portability:
    name: Windows Git Bash portability
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash  # GitHub's "bash" on Windows is Git Bash — the supported path
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.7"
          python-version: "3.12"

      - name: Confirm bash is Git Bash
        run: bash --version | head -1

      # Scaffold OUTSIDE the repo checkout: session_setup.sh resolves its root as
      # ${CLAUDE_PROJECT_DIR:-$(git rev-parse --show-toplevel)}, so a target inside
      # the project-init checkout would climb to the parent repo. RUNNER_TEMP is a
      # sibling of the workspace; cygpath -u makes it a bash-clean path.
      - name: Scaffold a project (outside the repo tree)
        run: |
          target="$(cygpath -u "$RUNNER_TEMP")/win-target"
          echo "WIN_TARGET=$target" >> "$GITHUB_ENV"
          uv run project-init "$target" \
            --non-interactive --preset obsidian-only --name win \
            --description "windows portability" --language python --no-plugin --strict

      - name: SessionStart bootstrap runs under Git Bash
        run: |
          cd "$WIN_TARGET"
          # CLAUDE_PROJECT_DIR is what Claude Code itself sets on every hook fire.
          CLAUDE_PROJECT_DIR="$WIN_TARGET" bash .agents/hooks/session_setup.sh
          test -f .agents/.session_setup_stamp

      - name: Commit gate runs under Git Bash against a staged file
        run: |
          cd "$WIN_TARGET"
          git init -q
          git config user.email ci@example.com
          git config user.name ci
          printf 'x = 1\n' > sample.py
          git add sample.py
          # PreToolUse hook: reads tool JSON on stdin, must exit 0 for a clean file.
          printf '%s' '{"tool_input":{"command":"git commit -m test"}}' \
            | CLAUDE_PROJECT_DIR="$WIN_TARGET" bash .agents/hooks/pre_commit_gate.sh
          echo "pre_commit_gate.sh exit: $?"

      - name: _py.sh resolves an interpreter on Windows
        run: |
          cd "$WIN_TARGET"
          out=$(bash .agents/hooks/_py.sh -c "print('resolver-ok')")
          test "$out" = "resolver-ok"

  # All-green gate (#638/#589): the SINGLE required status check for branch
  # protection. Branch protection requires only "CI gate", so the required
  # context is robust to the matrix — adding/removing a Python version never
  # renames it, and there is no un-expanded matrix name (e.g. "Lint and test
  # (3.11)") for GitHub to fail to match against, which would leave main
  # permanently blocked on a missing context. `if: always()` so the gate runs
  # even when an upstream job fails, then fails itself unless every dependency
  # succeeded. Mirrors the ci-gate the scaffolded ci.yml.tmpl ships (the repo's
  # own CI was behind its own product).
  #
  # needs = only jobs that ALWAYS run: a skipped need counts as not-success and
  # would red the gate. `checks` and `test` (all 4 shards) always run; wheel-smoke
  # skips only when `checks` fails (gate should be red then anyway); the
  # conditional portability jobs are deliberately out (they skip on non-shell PRs
  # and were never required contexts). The nightly full-matrix test job is not a
  # merge gate (it runs on schedule only, in nightly.yml).
  ci-gate:
    name: CI gate
    runs-on: ubuntu-24.04
    needs: [checks, test, wheel-smoke, secret-scan, shellcheck]
    if: always()
    steps:
      - name: Require all upstream jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed (got: $result)."
              exit 1
            fi
          done
          echo "All required jobs passed."
