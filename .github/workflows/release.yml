# Release on tag push (ADR-008): build the wheel, generate the changelog
# for the latest tag from Conventional Commits (ADR-006), publish a GitHub
# Release with the artifacts.
#
# Cutting a release:
#   1. Bump version in pyproject.toml AND src/project_init/__init__.py
#   2. git tag vX.Y.Z && push the tag
name: Release

on:
  push:
    tags: ["v*"]
  # Manual dispatch for environments where a tag can't be pushed directly
  # (e.g. a branch-scoped git proxy): the requested tag is verified against
  # pyproject the same way, and the release step creates it at HEAD.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) — must match the pyproject version"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          # Full history — git-cliff needs prior tags to scope --latest.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.7"

      - name: Verify tag matches package version
        run: |
          # Tag push: GITHUB_REF_NAME is the tag. Dispatch: the tag comes from
          # the input (GITHUB_REF_NAME would be the branch).
          RELEASE_TAG="${{ inputs.tag || '' }}"
          RELEASE_TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          PKG_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$PKG_VERSION" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match pyproject version $PKG_VERSION"
            exit 1
          fi

      - name: Build wheel + sdist
        run: uv build

      - name: Generate changelog (latest tag)
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4
        with:
          config: cliff.toml
          # Tag push: the tag exists, scope to it. Dispatch: the tag doesn't
          # exist yet, so scope to the unreleased span AS the requested tag.
          args: ${{ github.event_name == 'workflow_dispatch' && format('--unreleased --tag {0}', inputs.tag) || '--latest' }}
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3
        with:
          # Tag push: same as github.ref (no behavior change). Dispatch: the
          # tag doesn't exist yet — the action creates it at the checked-out
          # HEAD, which the version guard above already validated.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          # Only the build artifacts — an unscoped glob also picks up the
          # tracked dist/.gitignore and uploads it as a stray
          # `default.gitignore` asset (PI-183).
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: RELEASE_NOTES.md

  # PyPI via trusted publishing (ADR-011): OIDC, no tokens to custody.
  # One-time setup: register the pending publisher on pypi.org
  # (project: project-init, owner: VytCepas, workflow: release.yml,
  # environment: pypi).
  publish-pypi:
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/project-init
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.7"

      - name: Build wheel + sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
