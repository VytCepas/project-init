# Cut a release when a tag can't be pushed directly (e.g. release automation
# behind a branch-scoped git proxy): verify the requested tag against the
# pyproject version — the same guard release.yml applies to a pushed tag —
# create the tag at the checked-out HEAD, then dispatch release.yml ON the
# new tag ref. The chain-dispatch is required twice over: a GITHUB_TOKEN tag
# push never triggers release.yml's tag-push path (recursive-workflow rule),
# and the pypi environment only deploys from v* tag refs (ADR-011), so the
# release run must live on the tag ref, not on a branch.
name: Tag Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) — must match the pyproject version"
        required: true

permissions:
  contents: write
  actions: write  # dispatch release.yml on the new tag ref

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.7"

      - name: Verify requested tag matches package version
        env:
          # Through env, never inline `${{ inputs.tag }}` in run: — inline
          # interpolation happens before Bash parses the script, so a crafted
          # input could inject commands into a contents:write job.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$INPUT_TAG" in
            v[0-9]*) ;;
            *)
              echo "Tag '$INPUT_TAG' must look like vX.Y.Z"
              exit 1
              ;;
          esac
          PKG_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$PKG_VERSION" != "$INPUT_TAG" ]; then
            echo "Tag $INPUT_TAG does not match pyproject version $PKG_VERSION"
            exit 1
          fi

      - name: Create and push the tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$INPUT_TAG" >/dev/null; then
            echo "Tag $INPUT_TAG already exists locally — refusing to move it"
            exit 1
          fi
          git tag "$INPUT_TAG"
          git push origin "refs/tags/$INPUT_TAG"

      - name: Dispatch the release workflow on the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: gh workflow run release.yml --ref "$INPUT_TAG"
