# mypy.ini — static type checking gates for this repo's own code (#639).
# ruff lints; it does not type-check. `just typecheck` runs this against src/
# only — test code and agent infra (.agents/**) are out of scope: mypy is
# invoked on `src/`, so nothing else is checked.
#
# This repo dogfoods the mypy.ini its own scaffolder ships (templates/base/
# mypy.ini.tmpl): same strict baseline, same python_version floor. The prior
# "ruff only, no mypy" stance was dropped in #639 — the scaffolder is the
# product, and shipping a strict typecheck gate we don't run ourselves was the
# "not a good example of its own output" gap CLAUDE.md warns about.
#
# python_version pins the typeshed/syntax baseline: the requires-python floor
# (3.11), which is also the oldest CI matrix leg (#638). Keep it aligned with
# pyproject's requires-python.
#
# Deliberately NOT enabled: disallow_any_explicit / disallow_any_decorated.
# strict = True already covers the flags with a good signal-to-noise ratio;
# those two fire on legitimate, idiomatic Any (JSON blobs, Callable wrappers).

[mypy]
python_version = 3.11
strict = True
warn_unused_configs = True
