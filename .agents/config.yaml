context: repo
repo-kind: scaffolder  # standards/naming/repo-kinds.tsv: the kind of repo this is, which fixes the task verbs its justfile must carry (harbor#1428)
# Project configuration read by lifecycle scripts and hooks
# (create_issue.sh, start_issue.sh, setup_github.sh, workflow_state_reminder.sh).
project:
  name: "project-init"
  project_key: "PI"
  github_project_number: 2
  # The scaffolder declares the descriptor contract it defines (scaffold.CONTRACT_VERSION); it is never
  # scaffolded from itself, so it records no project_init_version or manifest (PI-1093).
  project_init_contract_version: 2
