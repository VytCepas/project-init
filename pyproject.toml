[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-init"
version = "1.1.4"
description = "Scaffolder for agentic-development infrastructure inside any project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Vytautas Čepas", email = "vyt.cepas.ve@gmail.com" }]
keywords = ["claude-code", "agents", "scaffolding", "obsidian", "graphify"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Environment :: Console",
]

dependencies = [
    "rich>=13.7",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.7.6",
]

# Dev tooling lives in a PEP 735 dependency-group — the layout project-init
# scaffolds into target projects (`uv sync --group dev`). Dogfooding it here
# keeps the bootstrap consistent across the repo and its templates (PI #552).
[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # `patch = ["subprocess"]` in [tool.coverage.run] landed in coverage 7.10.
    "coverage>=7.10",
    "pytest-xdist>=3.0",
    # Deterministic, race-free CI test sharding across parallel jobs (PI-762):
    # each shard is a separate serial process, so the xdist in-process
    # interference (#668/PI-759) cannot occur. `just test` still uses xdist locally.
    "pytest-split>=0.8",
    # Workflow-schema gate (#719): an invalid trigger made GitHub reject a whole
    # workflow file at load time. Declared here so tests/integration/
    # test_workflow_lint_gate.py never silently skips.
    "actionlint-py>=1.7.12",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
project-init = "project_init.__main__:main"

[project.urls]
Repository = "https://github.com/VytCepas/project-init"
Documentation = "https://vytcepas.github.io/project-init/"
Changelog = "https://github.com/VytCepas/project-init/releases"
Issues = "https://github.com/VytCepas/project-init/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/project_init"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "project_init/templates"
# Ship the machine-readable contract schemas inside the wheel (#786) so a
# downstream consumer (a root orchestrator) can load and pin them from an
# installed project-init — see project_init.schema.
"schemas" = "project_init/schemas"

[tool.ruff]
line-length = 100
target-version = "py311"
# `.claude/` is a generated, delete-aware mirror of `.agents/` (tools/sync_claude_dir.py)
# so Claude Code — which reads `.claude/` only — loads this repo's own hooks/skills.
# Lint the canonical `.agents/` source, never the derived copy.
extend-exclude = [".claude"]

[tool.ruff.lint]
# D/C901/PLR091x dogfood the quality toolchain scaffolded into target
# projects (PI-138): enforced docstrings and mechanical complexity gates.
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D", "C901", "PLR0912", "PLR0913", "PLR0915"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Test names are self-describing; docstring enforcement adds noise not value.
"tests/**" = ["D"]
# Agent infrastructure (hooks/scripts), not project code — the quality gates
# target the code a project ships. Scaffolded ruff.toml mirrors this.
".agents/**" = ["D", "C901", "PLR0912", "PLR0913", "PLR0915"]
"templates/**" = ["D", "C901", "PLR0912", "PLR0913", "PLR0915"]
# Synced byte-for-byte from templates/ by tools/sync_plugin.py (ADR-010).
"plugins/**" = ["D", "C901", "PLR0912", "PLR0913", "PLR0915"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure Python logic and small rendering checks with no subprocesses",
    "contract: scaffolded template and documentation contract checks",
    "integration: CLI, hook, or scaffolded script behavior using subprocesses",
    "smoke: packaging or installed-artifact end-to-end smoke checks",
    "slow: needs a non-python toolchain (bun, cargo); skipped where absent",
]

# Coverage (#636): drift visibility per-PR, a regression floor nightly. There is
# no `fail_under` HERE — the floor lives in the nightly workflow's pytest
# invocation (`--cov-fail-under=85`, PI-765), not in this config, so per-PR runs
# (and `just test-cov`) stay ungated while the nightly full-suite run catches a
# real drop. 85% is below the current ~92% so it never blocks a PR on a number
# nobody chose. Deliberately not wired into `just test-quick`: that recipe is the
# fail-fast iterate loop, and coverage costs a measurable slice of its runtime.
[tool.coverage.run]
source = ["src/project_init"]
branch = true
# Most integration tests drive the scaffolder as a subprocess (`python -m
# project_init`), and coverage records nothing in a child process by default:
# the CLI then reads as mostly-dead code (11% total, concerns.py at 0%), which is
# a worse signal than no number at all. `patch = ["subprocess"]` makes coverage
# instrument the children itself (needs coverage>=7.10); `parallel` gives each
# one its own data file for pytest-cov to combine. Together: 92% (PR #718 review).
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
# Fully-covered files add ~40 lines of noise to every run for no signal
# (token-efficiency, PI-641). The uncovered ones are the point.
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
